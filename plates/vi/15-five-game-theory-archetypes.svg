<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Five Game Theory Archetypes"><title>Five Game Theory Archetypes</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="440" rx="12" fill="var(--bg, #f5f6fb)"/>
    <rect x="24" y="20" width="852" height="400" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Lý thuyết Trò chơi: 5 Mô hình Tương tác Chiến lược Kinh điển (tr. 136–139)</text>
    <text x="44" y="72" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Kết quả của mỗi bên phụ thuộc vào lựa chọn của tất cả các bên—hãy nhận diện đúng trò chơi trước khi hành động.</text>
    <rect x="44" y="86" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#b81f2e" stroke-width="2"/><text x="58" y="112" font-size="12.5" font-weight="800" fill="#b81f2e">1 · Tiến thoái Lưỡng nan Tù nhân</text><text x="58" y="140" font-size="11" fill="var(--ink, #15172e)">Im lặng/Im lặng = (2 năm, 2 năm) ★</text><text x="58" y="162" font-size="11" fill="var(--ink-2, #4a4f6a)">Thú tội/Thú tội = (3 năm, 3 năm) Bẫy!</text><line x1="58" y1="180" x2="292" y2="180" stroke="var(--line-2, #cbd1e1)"/><text x="58" y="204" font-size="11" font-weight="700" fill="#b81f2e">Bài học: Thỏa thuận hợp tác + phạt phản bội</text><rect x="320" y="86" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#946200" stroke-width="2"/><text x="334" y="112" font-size="12.5" font-weight="800" fill="#946200">2 · Trò chơi Gà (Đối đầu)</text><text x="334" y="140" font-size="11" fill="var(--ink, #15172e)">Cùng nhường = Cả hai an toàn</text><text x="334" y="162" font-size="11" fill="var(--ink-2, #4a4f6a)">Không ai nhường = Đâm nhau thảm khốc!</text><line x1="334" y1="180" x2="568" y2="180" stroke="var(--line-2, #cbd1e1)"/><text x="334" y="204" font-size="11" font-weight="700" fill="#946200">Bài học: Đừng dồn đối phương vào chân tường</text><rect x="596" y="86" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="2"/><text x="610" y="112" font-size="12.5" font-weight="800" fill="#0d9488">3 · Chia Bánh Công bằng</text><text x="610" y="140" font-size="11" fill="var(--ink, #15172e)">Người A cắt bánh làm 2 phần</text><text x="610" y="162" font-size="11" fill="var(--ink-2, #4a4f6a)">Người B được quyền chọn phần trước</text><line x1="610" y1="180" x2="844" y2="180" stroke="var(--line-2, #cbd1e1)"/><text x="610" y="204" font-size="11" font-weight="700" fill="#0d9488">Bài học: Cơ chế tự bảo đảm sự công bằng</text><rect x="182" y="248" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#2458d3" stroke-width="2"/><text x="196" y="274" font-size="12.5" font-weight="800" fill="#2458d3">4 · Cuộc chiến Giới tính</text><text x="196" y="302" font-size="11" fill="var(--ink, #15172e)">Đi chung: Ca nhạc (5,3) / Bóng đá (3,5)</text><text x="196" y="324" font-size="11" fill="var(--ink-2, #4a4f6a)">Đi riêng = (2,2) Tổng thỏa mãn thấp nhất!</text><line x1="196" y1="342" x2="430" y2="342" stroke="var(--line-2, #cbd1e1)"/><text x="196" y="366" font-size="11" font-weight="700" fill="#2458d3">Bài học: Thỏa hiệp có đi có lại dài hạn</text><rect x="470" y="248" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#6835f0" stroke-width="2"/><text x="484" y="274" font-size="12.5" font-weight="800" fill="#6835f0">5 · Oẳn tù tỳ (Tổng bằng 0)</text><text x="484" y="302" font-size="11" fill="var(--ink, #15172e)">Đá thắng Kéo &gt; Giấy &gt; Đá</text><text x="484" y="324" font-size="11" fill="var(--ink-2, #4a4f6a)">Mọi quy luật lặp lại đều bị bắt bài</text><line x1="484" y1="342" x2="718" y2="342" stroke="var(--line-2, #cbd1e1)"/><text x="484" y="366" font-size="11" font-weight="700" fill="#6835f0">Bài học: Luân phiên ngẫu nhiên không quy luật</text>
    </svg>