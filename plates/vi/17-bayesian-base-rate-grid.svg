    <rect x="366" y="104" width="486" height="282" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#6835f0" stroke-width="1.8"/>
    <rect x="386" y="124" width="18" height="18" rx="4" fill="#b81f2e"/>
    <text x="414" y="138" font-size="12.5" font-weight="700" fill="var(--ink, #15172e)">1 Người Mắc bệnh Thật → Dương tính thật (0,99 ≈ 1 ô đỏ)</text>

    <rect x="386" y="156" width="18" height="18" rx="4" fill="#f59e0b"/>
    <text x="414" y="170" font-size="12.5" font-weight="700" fill="var(--ink, #15172e)">2 Người Khỏe mạnh → Dương tính giả! (99 × 2% = 1,98 ≈ 2 ô vàng)</text>

    <rect x="386" y="188" width="18" height="18" rx="4" fill="var(--surface, #ffffff)" stroke="var(--line-2, #cbd1e1)"/>
    <text x="414" y="202" font-size="12.5" fill="var(--ink-2, #4a4f6a)">97 Người Khỏe mạnh → Âm tính thật</text>

    <line x1="386" y1="222" x2="832" y2="222" stroke="var(--line-2, #cbd1e1)"/>
    <text x="386" y="250" class="mn" font-size="13" font-weight="800" fill="var(--c-prob, #6835f0)">P(b | d) = 0.0099 / (0.0099 + 0.0198) = 1 / 3 ≈ 33.3%</text>
    <text x="386" y="280" font-size="12" fill="var(--ink, #15172e)">• Trong ~3 người nhận phiếu dương tính, chỉ có 1 người bệnh thật (33%)!</text>
    <text x="386" y="304" font-size="12" fill="var(--ink, #15172e)">• Nếu tỷ lệ bệnh nền chỉ 1/1.000 (0,001), xác suất bệnh thật chỉ còn 3,3%!</text>
    <text x="386" y="332" font-size="12" font-weight="700" fill="var(--c-analytical, #0b7268)">• Nhưng xét nghiệm vẫn rất giá trị: nguy cơ đã tăng gấp 33 lần mức nền 1%!</text>
    <text x="386" y="362" font-size="11" font-style="italic" fill="var(--ink-2, #4a4f6a)">Bài học cốt tử: Không bao giờ quên Xác suất cơ sở P(A) khi cập nhật niềm tin.</text>
    </svg>