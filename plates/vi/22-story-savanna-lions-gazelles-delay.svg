    <rect x="24" y="20" width="852" height="380" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Chuyện Hệ Sinh Thái Đồng Cỏ: Vì Sao ‘Cứu’ Linh Dương Lại Khiến Cả Đàn Chết Đói (Chương 6, tr. 114, 122)</text>
    <text x="44" y="74" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Tư duy tuyến tính chỉ thấy thú dữ ăn thịt con mồi; Tư duy hệ thống thấy vòng cân bằng có độ trễ giữ đồng cỏ xanh tươi.</text>

