<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Analytical Thinking Tool Chain"><title>Analytical Thinking Tool Chain</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="450" rx="12" fill="var(--bg, #f5f6fb)"/><defs>
      <marker id="arInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2, #4a4f6a)"/>
      </marker>
      <marker id="arTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#0d9488"/>
      </marker>
      <marker id="arRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#b81f2e"/>
      </marker>
      <marker id="arGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#0b7547"/>
      </marker>
      <marker id="arBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#2458d3"/>
      </marker>
    </defs>
    <rect x="24" y="20" width="852" height="410" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Chuỗi Liên hoàn Công cụ Tư duy Phân tích (tr. 71–84)</text>
    <text x="44" y="73" font-size="12.5" fill="var(--ink-2, #4a4f6a)">“Trong thực hành tư duy phân tích, các công cụ hiếm khi dùng độc lập mà kết hợp chặt chẽ với nhau.”</text>

    <!-- 1. Fishbone -->
    <rect x="44" y="96" width="388" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="1.8"/>
    <text x="60" y="120" font-weight="800" font-size="13" fill="var(--c-analytical, #0b7268)">1 · BIỂU ĐỒ XƯƠNG CÁ (Phân rã diện rộng)</text>
    <line x1="68" y1="176" x2="346" y2="176" stroke="#0d9488" stroke-width="2.6" marker-end="url(#arTeal)"/>
    <line x1="115" y1="138" x2="150" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="195" y1="138" x2="230" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="275" y1="138" x2="310" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="115" y1="216" x2="150" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="195" y1="216" x2="230" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="275" y1="216" x2="310" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <polygon points="350,154 418,176 350,198" fill="#0d9488"/>
    <text x="378" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Vấn đề</text>
    <text x="112" y="134" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Máy móc</text>
    <text x="192" y="134" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Quy trình</text>
    <text x="275" y="134" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Vật liệu</text>
    <text x="112" y="231" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Con người</text>
    <text x="192" y="231" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Đo lường</text>
    <text x="275" y="231" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Môi trường</text>

    <!-- 2. 5 Whys -->
    <rect x="468" y="96" width="388" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#2458d3" stroke-width="1.8"/>
    <text x="484" y="120" font-weight="800" font-size="13" fill="var(--c-critical, #2458d3)">2 · 5 CÂU HỎI TẠI SAO (Đào tới gốc rễ)</text>
    <text x="484" y="144" font-size="11.5" fill="var(--ink, #15172e)">Tại sao 1: Quá tải mạch, đứt cầu chì</text>
    <text x="498" y="163" font-size="11.5" fill="var(--ink, #15172e)">↳ Tại sao 2–3: Kẹt vòng bi ← Bơm thiếu dầu</text>
    <text x="512" y="182" font-size="11.5" fill="var(--ink, #15172e)">↳ Tại sao 4: Cửa hút tắc vụn kim loại</text>
    <text x="526" y="203" font-size="12" font-weight="800" fill="var(--c-trap, #b81f2e)">↳ Tại sao 5 (Gốc): Bơm thiếu bộ lọc! [Xác minh]</text>

    <!-- 3. SWOT -->
    <rect x="44" y="258" width="388" height="150" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#946200" stroke-width="1.8"/>
    <text x="60" y="282" font-weight="800" font-size="13" fill="var(--c-creative, #946200)">3 · MA TRẬN SWOT &amp; SO SÁNH TRỌNG SỐ</text>
    <rect x="60" y="294" width="174" height="46" rx="6" fill="rgba(21,128,61,0.12)"/>
    <text x="147" y="321" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-systems, #0b7547)">S · Điểm mạnh (Nội tại)</text>
    <rect x="242" y="294" width="174" height="46" rx="6" fill="rgba(229,51,63,0.10)"/>
    <text x="329" y="321" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-trap, #b81f2e)">W · Điểm yếu (Nội tại)</text>
    <rect x="60" y="346" width="174" height="46" rx="6" fill="rgba(37,99,235,0.10)"/>
    <text x="147" y="373" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-critical, #2458d3)">O · Cơ hội (Bên ngoài)</text>
    <rect x="242" y="346" width="174" height="46" rx="6" fill="rgba(217,119,6,0.14)"/>
    <text x="329" y="373" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-strategic, #b34a00)">T · Thách thức (Bên ngoài)</text>

    <!-- 4. Eisenhower (Upgrades blurry Fig 4.3!) -->
    <rect x="468" y="258" width="388" height="150" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#3346e0" stroke-width="1.8"/>
    <text x="484" y="282" font-weight="800" font-size="13" fill="var(--c-logical, #3346e0)">4 · MA TRẬN ƯU TIÊN EISENHOWER (tr. 80)</text>
    <rect x="484" y="294" width="174" height="46" rx="6" fill="rgba(229,51,63,0.12)" stroke="#b81f2e"/>
    <text x="571" y="314" text-anchor="middle" font-size="11" font-weight="800" fill="var(--c-trap, #b81f2e)">Ô 1 · Khẩn cấp + Quan trọng</text>
    <text x="571" y="330" text-anchor="middle" font-size="10.5" fill="var(--ink, #15172e)">Thực hiện ngay</text>
    <rect x="666" y="294" width="174" height="46" rx="6" fill="rgba(13,148,136,0.15)" stroke="#0d9488" stroke-width="2"/>
    <text x="753" y="314" text-anchor="middle" font-size="11" font-weight="800" fill="var(--c-analytical, #0b7268)">Ô 2 · Không khẩn + Quan trọng</text>
    <text x="753" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--c-analytical, #0b7268)">Lên lịch chuẩn bị sớm ★</text>
    <rect x="484" y="346" width="174" height="46" rx="6" fill="var(--surface, #ffffff)" stroke="var(--line-2, #cbd1e1)"/>
    <text x="571" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2, #4a4f6a)">Ô 3 · Khẩn + Không quan trọng</text>
    <text x="571" y="382" text-anchor="middle" font-size="10.5" fill="var(--ink-3, #656b87)">Ủy nhiệm</text>
    <rect x="666" y="346" width="174" height="46" rx="6" fill="var(--surface, #ffffff)" stroke="var(--line-2, #cbd1e1)"/>
    <text x="753" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-3, #656b87)">Ô 4 · Không khẩn + Không QT</text>
    <text x="753" y="382" text-anchor="middle" font-size="10.5" fill="var(--ink-3, #656b87)">Cần loại bỏ</text>
    </svg>