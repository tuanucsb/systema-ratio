    <!-- Comparison Annotations (Right) -->
    <rect x="536" y="88" width="316" height="126" rx="10" fill="rgba(229,51,63,0.08)" stroke="#b81f2e" stroke-width="1.8"/>
    <text x="554" y="116" font-weight="800" font-size="13.5" fill="var(--c-trap, #b81f2e)">✗ Lập luận Xuôi Dễ Mắc Bẫy (Hệ thống 1)</text>
    <text x="554" y="140" font-size="12" fill="var(--ink, #15172e)">Chấm đỏ = vết đạn trên máy bay ĐÃ TRỞ VỀ.</text>
