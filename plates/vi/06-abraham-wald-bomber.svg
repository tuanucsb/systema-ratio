    <text x="554" y="284" font-size="12" fill="var(--ink, #15172e)">Dính đạn ở vùng chấm đỏ mà máy bay VẪN VỀ ĐƯỢC.</text>
    <text x="554" y="306" font-size="12" fill="var(--ink, #15172e)">Vết đạn chí mạng nằm trên những chiếc ĐÃ RƠI!</text>
