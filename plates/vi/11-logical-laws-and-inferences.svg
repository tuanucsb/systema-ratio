<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" role="img" aria-label="Logical Laws and Inference Engines"><title>Logical Laws and Inference Engines</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="444" rx="12" fill="var(--bg, #f5f6fb)"/>
    <rect x="24" y="20" width="852" height="404" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Tư duy Logic: 4 Nguyên lý Gốc &amp; 4 Công cụ Suy luận (tr. 88–98)</text>
    <text x="44" y="72" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Logic là ngữ pháp của mọi lập luận—phân định rạch ròi suy luận chắc chắn 100% với suy luận xác suất.</text>
    <rect x="44" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="141" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">A ≡ A</text><text x="141" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">1. Đồng nhất</text><text x="141" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Giữ nguyên nghĩa khái niệm</text><rect x="250" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="347" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">¬(A ∧ ¬A)</text><text x="347" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">2. Không mâu thuẫn</text><text x="347" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Không vừa đúng vừa sai cùng nghĩa</text><rect x="456" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="553" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">A ∨ ¬A</text><text x="553" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">3. Loại trừ trung gian</text><text x="553" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Không có trạng thái lơ lửng</text><rect x="662" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="759" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">P ⇒ Q</text><text x="759" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">4. Đủ lý do</text><text x="759" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Mọi kết luận phải đủ căn cứ</text>
    <rect x="44" y="186" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#3346e0" stroke-width="1.8"/><text x="60" y="210" font-size="13" font-weight="800" fill="#3346e0">DIỄN DỊCH (Từ trên xuống)</text><text x="60" y="232" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">Tiền đề chung → Cụ thể  ·  Chắc chắn 100% (nếu tiền đề đúng)</text><text x="60" y="258" font-size="11" fill="var(--c-trap, #b81f2e)">Bẫy: Cá voi ≠ cá; Sai bao hàm tập hợp</text><rect x="456" y="186" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="1.8"/><text x="472" y="210" font-size="13" font-weight="800" fill="#0d9488">QUY NẠP (Từ dưới lên)</text><text x="472" y="232" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">Quan sát cụ thể → Quy luật  ·  Mang tính xác suất (cập nhật)</text><text x="472" y="258" font-size="11" fill="var(--c-trap, #b81f2e)">Bẫy: Mẫu nhỏ; Thiên nga đen 1697</text><rect x="44" y="300" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#946200" stroke-width="1.8"/><text x="60" y="324" font-size="13" font-weight="800" fill="#946200">NHÂN QUẢ (5 Yếu tố)</text><text x="60" y="346" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">Thời gian + Tương quan + Cơ chế  ·  Giải thích cơ chế A sinh ra B</text><text x="60" y="372" font-size="11" fill="var(--c-trap, #b81f2e)">Bẫy: Kem &amp; kính râm (do trời nắng!)</text><rect x="456" y="300" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#bd1e68" stroke-width="1.8"/><text x="472" y="324" font-size="13" font-weight="800" fill="#bd1e68">TƯƠNG TỰ (Loại suy)</text><text x="472" y="346" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">A, B chung c,d,e → B có f?  ·  Xác suất theo chiều sâu tương đồng</text><text x="472" y="372" font-size="11" fill="var(--c-trap, #b81f2e)">Bẫy: Cá mập – hổ; Đặng Thái Sơn</text>
    </svg>