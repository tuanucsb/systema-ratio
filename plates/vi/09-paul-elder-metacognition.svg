    <rect x="24" y="20" width="852" height="400" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="46" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Phản biện Tầng 2: Tư duy về Chính Quá trình Tư duy Paul–Elder (tr. 60–63)</text>
    <text x="46" y="74" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Áp dụng 8 Tiêu chuẩn Trí tuệ lên 8 Thành tố Tư duy nhằm bồi đắp 8 Phẩm chất của người tư duy công bằng.</text>
    <rect x="46" y="96" width="248" height="296" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#087087" stroke-width="2"/><rect x="46" y="96" width="248" height="52" rx="10" fill="#087087"/><text x="170" y="118" text-anchor="middle" class="mn" font-size="11" font-weight="800" fill="#ffffff">BƯỚC 1 · PHÂN TÍCH</text><text x="170" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8 Thành tố Tư duy</text><text x="64" y="174" font-size="12" font-weight="600" fill="var(--ink, #15172e)">1. Mục đích</text><text x="64" y="200" font-size="12" font-weight="600" fill="var(--ink, #15172e)">2. Câu hỏi chính</text><text x="64" y="226" font-size="12" font-weight="600" fill="var(--ink, #15172e)">3. Quan điểm</text><text x="64" y="252" font-size="12" font-weight="600" fill="var(--ink, #15172e)">4. Giả định</text><text x="64" y="278" font-size="12" font-weight="600" fill="var(--ink, #15172e)">5. Thông tin</text><text x="64" y="304" font-size="12" font-weight="600" fill="var(--ink, #15172e)">6. Suy luận</text><text x="64" y="330" font-size="12" font-weight="600" fill="var(--ink, #15172e)">7. Kết luận</text><text x="64" y="356" font-size="12" font-weight="600" fill="var(--ink, #15172e)">8. Hệ quả</text><line x1="298" y1="244" x2="320" y2="244" stroke="var(--ink-2, #4a4f6a)" stroke-width="2.4" marker-end="url(#arInk)"/><rect x="326" y="96" width="248" height="296" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#2458d3" stroke-width="2"/><rect x="326" y="96" width="248" height="52" rx="10" fill="#2458d3"/><text x="450" y="118" text-anchor="middle" class="mn" font-size="11" font-weight="800" fill="#ffffff">BƯỚC 2 · ĐÁNH GIÁ</text><text x="450" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8 Tiêu chuẩn Trí tuệ</text><text x="344" y="174" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Tính chính xác</text><text x="344" y="200" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Tính nhất quán / cụ thể</text><text x="344" y="226" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Tính thích đáng</text><text x="344" y="252" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Độ sâu</text><text x="344" y="278" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Độ rộng</text><text x="344" y="304" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Tính logic</text><text x="344" y="330" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Tầm quan trọng</text><text x="344" y="356" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Tính công bằng</text><line x1="578" y1="244" x2="600" y2="244" stroke="var(--ink-2, #4a4f6a)" stroke-width="2.4" marker-end="url(#arInk)"/><rect x="606" y="96" width="248" height="296" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="2"/><rect x="606" y="96" width="248" height="52" rx="10" fill="#0d9488"/><text x="730" y="118" text-anchor="middle" class="mn" font-size="11" font-weight="800" fill="#ffffff">BƯỚC 3 · CẢI THIỆN</text><text x="730" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8 Phẩm chất Trí tuệ</text><text x="624" y="174" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Khiêm tốn trí tuệ</text><text x="624" y="200" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Dũng cảm trí tuệ</text><text x="624" y="226" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Đồng cảm trí tuệ</text><text x="624" y="252" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Tự chủ trí tuệ</text><text x="624" y="278" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Chính trực trí tuệ</text><text x="624" y="304" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Kiên trì trí tuệ</text><text x="624" y="330" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Niềm tin vào Lý trí</text><text x="624" y="356" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Công bằng</text>
