<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="10 Cognitive Biases and Proverbs"><title>10 Cognitive Biases and Proverbs</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="480" rx="12" fill="var(--bg, #f5f6fb)"/>
    <rect x="24" y="20" width="852" height="440" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="42" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">10 Thiên kiến Bản năng Phổ biến &amp; Tục ngữ Dân gian Việt Nam (tr. 15–18)</text>
    <text x="42" y="74" font-size="12.5" fill="var(--ink-2, #4a4f6a)">“Sai lầm trong tư duy tự phát không phải là ngoại lệ, mà là trạng thái mặc định.”</text>
    <rect x="42" y="92" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="42" y="92" width="34" height="58" rx="8" fill="#b81f2e"/><text x="59" y="126" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">1</text><text x="88" y="115" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Thiên kiến xác nhận</text><text x="432" y="115" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">“Yêu nên tốt, ghét nên xấu”</text><text x="88" y="136" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Chỉ gom bằng chứng hợp ý mình</text><rect x="458" y="92" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="458" y="92" width="34" height="58" rx="8" fill="#b81f2e"/><text x="475" y="126" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">2</text><text x="504" y="115" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Hiệu ứng neo</text><text x="848" y="115" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">Áo 1 triệu → 900k → 800k</text><text x="504" y="136" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Bị con số đầu tiên neo nhận thức</text><rect x="42" y="162" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="42" y="162" width="34" height="58" rx="8" fill="#b81f2e"/><text x="59" y="196" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">3</text><text x="88" y="185" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Thông tin sẵn có</text><text x="432" y="185" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">Tin tai nạn máy bay</text><text x="88" y="206" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Thấy đưa tin nhiều tưởng nguy hiểm hơn</text><rect x="458" y="162" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="458" y="162" width="34" height="58" rx="8" fill="#b81f2e"/><text x="475" y="196" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">4</text><text x="504" y="185" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Hiệu ứng đóng khung</text><text x="848" y="185" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">90% sống vs. 10% thất bại</text><text x="504" y="206" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Bị dẫn dắt bởi vỏ ngôn từ trình bày</text><rect x="42" y="232" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="42" y="232" width="34" height="58" rx="8" fill="#b81f2e"/><text x="59" y="266" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">5</text><text x="88" y="255" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Lỗi chi phí chìm</text><text x="432" y="255" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">“Đâm lao thì phải theo lao”</text><text x="88" y="276" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Tiếc vé ngồi xem hết phim dở</text><rect x="458" y="232" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="458" y="232" width="34" height="58" rx="8" fill="#b81f2e"/><text x="475" y="266" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">6</text><text x="504" y="255" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Ám ảnh thua thiệt</text><text x="848" y="255" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">“Con cá trượt là con cá to”</text><text x="504" y="276" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Nỗi đau mất lớn gấp 1,5–2,5 lần niềm vui</text><rect x="42" y="302" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="42" y="302" width="34" height="58" rx="8" fill="#b81f2e"/><text x="59" y="336" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">7</text><text x="88" y="325" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Hiệu ứng đám đông</text><text x="432" y="325" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">“A dua a tòng”</text><text x="88" y="346" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Tin và làm theo áp lực số đông</text><rect x="458" y="302" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="458" y="302" width="34" height="58" rx="8" fill="#b81f2e"/><text x="475" y="336" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">8</text><text x="504" y="325" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Thiên kiến quá tự tin</text><text x="848" y="325" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">80% tự nhận lái xe giỏi</text><text x="504" y="346" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Đánh giá năng lực vượt xa thực tế</text><rect x="42" y="372" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="42" y="372" width="34" height="58" rx="8" fill="#b81f2e"/><text x="59" y="406" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">9</text><text x="88" y="395" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Quyết định cảm xúc</text><text x="432" y="395" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">“Giận mất khôn”</text><text x="88" y="416" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Cảm xúc nhất thời đè bẹp lý trí</text><rect x="458" y="372" width="400" height="58" rx="8" fill="var(--surface-2, #eef1f8)" stroke="var(--line, #e1e5f0)"/><rect x="458" y="372" width="34" height="58" rx="8" fill="#b81f2e"/><text x="475" y="406" text-anchor="middle" class="mn" font-size="12" font-weight="800" fill="#ffffff">10</text><text x="504" y="395" font-size="13" font-weight="700" fill="var(--ink, #15172e)">Hiệu ứng Dunning–Kruger</text><text x="848" y="395" text-anchor="end" font-size="11.5" font-style="italic" font-weight="700" fill="var(--c-strategic, #b34a00)">“Thùng rỗng kêu to”</text><text x="504" y="416" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Biết ít tự phụ, biết sâu khiêm nhường</text>
    </svg>