ont-weight="700" fill="#bd1e68">Aim to REFUTE · Systems/Strat.</text><rect x="52" y="268" width="416" height="36" rx="7" fill="var(--surface-2, #eef1f8)" stroke="#087087" stroke-width="1.6"/><rect x="52" y="268" width="34" height="36" rx="7" fill="#087087"/><text x="69" y="291" text-anchor="middle" class="mn" font-size="11.5" font-weight="800" fill="#ffffff">5</text><text x="98" y="291" font-size="12.5" font-weight="800" fill="var(--ink, #15172e)">Analyze Data</text><text x="456" y="291" text-anchor="end" font-size="11" font-weight="700" fill="#087087">Analytical + Probabilistic</text><rect x="52" y="312" width="416" height="36" rx="7" fill="var(--surface-2, #eef1f8)" stroke="#087087" stroke-width="1.6"/><rect x="52" y="312" width="34" height="36" rx="7" fill="#087087"/><text x="69" y="335" text-anchor="middle" class="mn" font-size="11.5" font-weight="800" fill="#ffffff">6</text><text x="98" y="335" font-size="12.5" font-weight="800" fill="var(--ink, #15172e)">Conclude</text><text x="456" y="335" text-anchor="end" font-size="11" font-weight="700" fill="#087087">If refuted → loop to #3!</text><rect x="52" y="356" width="416" height="36" rx="7" fill="var(--surface-2, #eef1f8)" stroke="#087087" stroke-width="1.6"/><rect x="52" y="356" width="34" height="36" rx="7" fill="#087087"/><text x="69" y="379" text-anchor="middle" class="mn" font-size="11.5" font-weight="800" fill="#ffffff">7</text><text x="98" y="379" font-size="12.5" font-weight="800" fill="var(--ink, #15172e)">Share / Peer Review</text><text x="456" y="379" text-anchor="end" font-size="11" font-weight="700" fill="#087087">Open community critique</text>
