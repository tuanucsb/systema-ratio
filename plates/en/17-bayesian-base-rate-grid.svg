    <text x="190" y="402" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink-2, #4a4f6a)">100 Random People Screened</text>

    <!-- Explanation & Formula (Right) -->
    <rect x="366" y="104" width="486" height="282" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#6835f0" stroke-width="1.8"/>
    <rect x="386" y="124" width="18" height="18" rx="4" fill="#b81f2e"/>
    <text x="414" y="138" font-size="12.5" font-weight="700" fill="var(--ink, #15172e)">1 Truly Sick Person → Tests Positive (0.99 ≈ 1 red square)</text>

    <rect x="386" y="156" width="18" height="18" rx="4" fill="#f59e0b"/>
    <text x="414" y="170" font-size="12.5" font-weight="700" fill="var(--ink, #15172e)">2 Healthy People → False Positives! (99 × 2% = 1.98 ≈ 2 amber)</text>

    <rect x="386" y="188" width="18" height="18" rx="4" fill="var(--surface, #ffffff)" stroke="var(--line-2, #cbd1e1)"/>
    <text x="414" y="202" font-size="12.5" fill="var(--ink-2, #4a4f6a)">97 Healthy People → True Negatives</text>

    <line x1="386" y1="222" x2="832" y2="222" stroke="var(--line-2, #cbd1e1)"/>
    <text x="386" y="250" class="mn" font-size="13" font-weight="800" fill="var(--c-prob, #6835f0)">P(b | d) = 0.0099 / (0.0099 + 0.0198) = 1 / 3 ≈ 33.3%</text>
    <text x="386" y="280" font-size="12" fill="var(--ink, #15172e)">• Out of ~3 people who get a positive slip, only 1 is truly sick (33%)!</text>
    <text x="386" y="304" font-size="12" fill="var(--ink, #15172e)">• If prevalence is 1 in 1,000 (0.001), true risk drops to just 3.3%!</text>
    <text x="386" y="332" font-size="12" font-weight="700" fill="var(--c-analytical, #0b7268)">• Yet the test still matters: your risk rose 33× above the 1% prior!</text>
    <text x="386" y="362" font-size="11" font-style="italic" fill="var(--ink-2, #4a4f6a)">Never update beliefs without anchoring on Base Rate P(A) first.</text>
    </svg>