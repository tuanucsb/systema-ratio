<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Dual Systems &amp; Simon Loop"><title>Dual Systems &amp; Simon Loop</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="440" rx="12" fill="var(--bg, #f5f6fb)"/><defs>
      <marker id="arInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2, #4a4f6a)"/>
      </marker>
      <marker id="arTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#0d9488"/>
      </marker>
      <marker id="arRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#b81f2e"/>
      </marker>
      <marker id="arGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#0b7547"/>
      </marker>
      <marker id="arBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#2458d3"/>
      </marker>
    </defs>
    <rect x="24" y="22" width="852" height="396" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="46" y="54" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Two Systems of Thought &amp; Herbert Simon’s Intuition Loop</text>
    <text x="46" y="75" font-size="13" fill="var(--ink-2, #4a4f6a)">System 1 proposes continuously; lazy System 2 rubber-stamps—unless awakened by conscious method.</text>

    <!-- World Stimulus -->
    <rect x="46" y="138" width="136" height="118" rx="10" fill="var(--surface-2, #eef1f8)" stroke="var(--line-2, #cbd1e1)" stroke-width="1.5"/>
    <text x="114" y="175" text-anchor="middle" font-weight="700" font-size="13.5" fill="var(--ink, #15172e)">Complex Problem</text>
    <text x="114" y="196" text-anchor="middle" font-size="11.5" fill="var(--ink-2, #4a4f6a)">Signals &amp; Context</text>
    <text x="114" y="222" text-anchor="middle" class="mn" font-size="10.5" fill="var(--ink-3, #656b87)">Snake? · 1234×17?</text>

    <!-- System 1 Box -->
    <rect x="226" y="102" width="256" height="142" rx="10" fill="rgba(229,51,63,0.08)" stroke="#b81f2e" stroke-width="2"/>
    <text x="244" y="129" font-weight="800" font-size="14.5" fill="var(--c-trap, #b81f2e)">SYSTEM 1 · Fast &amp; Instinctive</text>
    <text x="244" y="150" font-size="12" fill="var(--ink, #15172e)">• Automatic, effortless, never sleeps</text>
    <text x="244" y="170" font-size="12" fill="var(--ink, #15172e)">• Driven by Memory + 3 Heuristics:</text>
    <text x="256" y="190" font-size="11.5" fill="var(--ink-2, #4a4f6a)">1. Swap hard question for easy one</text>
    <text x="256" y="208" font-size="11.5" fill="var(--ink-2, #4a4f6a)">2. Fixed norms  ·  3. WYSIATI</text>
    <text x="244" y="230" font-size="11" font-weight="700" fill="var(--c-trap, #b81f2e)">⚠ Spawns 10 Systematic Biases</text>

    <!-- System 2 Box -->
    <rect x="546" y="102" width="302" height="142" rx="10" fill="rgba(13,148,136,0.09)" stroke="#0d9488" stroke-width="2"/>
    <text x="564" y="129" font-weight="800" font-size="14.5" fill="var(--c-analytical, #0b7268)">SYSTEM 2 · Slow &amp; Methodical</text>
    <text x="564" y="150" font-size="12" fill="var(--ink, #15172e)">• Deliberate attention, agency &amp; rules</text>
    <text x="564" y="170" font-size="12" fill="var(--ink, #15172e)">• Chronic weakness: LAZY &amp; easily tired</text>
    <text x="564" y="193" font-size="11.5" font-weight="700" fill="var(--c-trap, #b81f2e)">Trap A: Rubber-stamps System 1</text>
    <text x="564" y="211" font-size="11.5" font-weight="700" fill="var(--c-creative, #946200)">Trap B: Wakes up, uses WRONG method</text>
    <text x="564" y="231" font-size="11.5" font-weight="700" fill="var(--c-analytical, #0b7268)">✓ Solution: 8 Elements + 8 Methods</text>

    <!-- Connecting Arrows -->
    <line x1="182" y1="180" x2="220" y2="165" stroke="var(--ink-2, #4a4f6a)" stroke-width="2" marker-end="url(#arInk)"/>
    <line x1="482" y1="152" x2="540" y2="152" stroke="#b81f2e" stroke-width="2.2" marker-end="url(#arRed)"/>
    <text x="511" y="143" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--c-trap, #b81f2e)">Hunches</text>
    <line x1="546" y1="196" x2="488" y2="196" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arTeal)"/>
    <text x="514" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--c-analytical, #0b7268)">Override</text>

    <!-- Herbert Simon Memory Consolidation Return Bar -->
    <rect x="226" y="286" width="622" height="96" rx="10" fill="rgba(37,99,235,0.08)" stroke="#2458d3" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M 700,244 L 700,286" fill="none" stroke="#2458d3" stroke-width="2.2" marker-end="url(#arBlue)"/>
    <path d="M 350,286 L 350,250" fill="none" stroke="#2458d3" stroke-width="2.2" marker-end="url(#arBlue)"/>
    <text x="537" y="316" text-anchor="middle" font-weight="800" font-size="13.5" fill="var(--c-critical, #2458d3)">HERBERT SIMON’S MEMORY CONSOLIDATION LOOP (p. 22)</text>
    <text x="537" y="339" text-anchor="middle" font-size="12" fill="var(--ink, #15172e)">“Intuition is nothing more and nothing less than recognition from memory.”</text>
    <text x="537" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="var(--c-analytical, #0b7268)">Disciplined System 2 practice today → Stored in Long-Term Memory → Smarter System 1 intuition tomorrow!</text>
    </svg>