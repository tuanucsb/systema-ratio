<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" role="img" aria-label="Logical Laws and Inference Engines"><title>Logical Laws and Inference Engines</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="444" rx="12" fill="var(--bg, #f5f6fb)"/>
    <rect x="24" y="20" width="852" height="404" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Logical Thinking: The 4 Classical Laws &amp; 4 Inference Engines (pp. 88–98)</text>
    <text x="44" y="72" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Logic is the grammar of all reasoning—distinguishing 100% deductive entailment from probabilistic induction and analogy.</text>
    <rect x="44" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="141" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">A ≡ A</text><text x="141" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">1. Identity</text><text x="141" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Keep term meaning fixed</text><rect x="250" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="347" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">¬(A ∧ ¬A)</text><text x="347" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">2. Non-Contradiction</text><text x="347" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Not true &amp; false in same respect</text><rect x="456" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="553" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">A ∨ ¬A</text><text x="553" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">3. Excluded Middle</text><text x="553" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">No murky third state</text><rect x="662" y="86" width="194" height="78" rx="8" fill="rgba(79,70,229,0.08)" stroke="#3346e0" stroke-width="1.6"/><text x="759" y="110" text-anchor="middle" class="mn" font-size="13" font-weight="800" fill="var(--c-logical, #3346e0)">P ⇒ Q</text><text x="759" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #15172e)">4. Sufficient Reason</text><text x="759" y="150" text-anchor="middle" font-size="10.5" fill="var(--ink-2, #4a4f6a)">Every claim needs ground</text>
    <rect x="44" y="186" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#3346e0" stroke-width="1.8"/><text x="60" y="210" font-size="13" font-weight="800" fill="#3346e0">DEDUCTION (Top-Down)</text><text x="60" y="232" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">General Rule → Specific Case  ·  100% Certain (if premises hold)</text><text x="60" y="258" font-size="11" fill="var(--c-trap, #b81f2e)">Trap: Whale ≠ Fish; Undistributed middle</text><rect x="456" y="186" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="1.8"/><text x="472" y="210" font-size="13" font-weight="800" fill="#0d9488">INDUCTION (Bottom-Up)</text><text x="472" y="232" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">Specific Cases → Pattern Law  ·  Probabilistic (revisable)</text><text x="472" y="258" font-size="11" fill="var(--c-trap, #b81f2e)">Trap: Small sample; 1697 Black Swan</text><rect x="44" y="300" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#946200" stroke-width="1.8"/><text x="60" y="324" font-size="13" font-weight="800" fill="#946200">CAUSAL (5 Criteria)</text><text x="60" y="346" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">Time + Corr + No-3rd + Mech  ·  Explains WHY X produces Y</text><text x="60" y="372" font-size="11" fill="var(--c-trap, #b81f2e)">Trap: Ice cream &amp; sunglasses (Sun!)</text><rect x="456" y="300" width="400" height="100" rx="9" fill="var(--surface-2, #eef1f8)" stroke="#bd1e68" stroke-width="1.8"/><text x="472" y="324" font-size="13" font-weight="800" fill="#bd1e68">ANALOGY (Loại suy)</text><text x="472" y="346" font-size="11.5" font-weight="700" fill="var(--ink, #15172e)">A &amp; B share c,d,e → B has f?  ·  Probabilistic structural transfer</text><text x="472" y="372" font-size="11" fill="var(--c-trap, #b81f2e)">Trap: Shark vs. Tiger; Piano equivocation</text>
    </svg>