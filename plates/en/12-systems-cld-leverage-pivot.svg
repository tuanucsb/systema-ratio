    <text x="660" y="142" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">★ Learning Opportunity (+)</text>
    <text x="786" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink, #15172e)">Less Fear &amp; Hiding (−)</text>
    <text x="660" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="var(--c-systems, #0b7547)">Open Data + Safe Experimentation (+)</text>
    <text x="532" y="210" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--c-systems, #0b7547)">Errors Fall (−)</text>
