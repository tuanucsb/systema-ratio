<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Five Game Theory Archetypes"><title>Five Game Theory Archetypes</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="440" rx="12" fill="var(--bg, #f5f6fb)"/>
    <rect x="24" y="20" width="852" height="400" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Strategic Game Theory: Five Archetypes of Human Interaction (pp. 136–139)</text>
    <text x="44" y="72" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Your outcome depends on everyone’s choices—diagnose which game you are in before making a move.</text>
    <rect x="44" y="86" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#b81f2e" stroke-width="2"/><text x="58" y="112" font-size="12.5" font-weight="800" fill="#b81f2e">1 · Prisoner’s Dilemma</text><text x="58" y="140" font-size="11" fill="var(--ink, #15172e)">Silent/Silent = (2y, 2y) ★ Best joint</text><text x="58" y="162" font-size="11" fill="var(--ink-2, #4a4f6a)">Confess/Confess = (3y, 3y) Trap!</text><line x1="58" y1="180" x2="292" y2="180" stroke="var(--line-2, #cbd1e1)"/><text x="58" y="204" font-size="11" font-weight="700" fill="#b81f2e">Lesson: Binding trust + punish betrayal</text><rect x="320" y="86" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#946200" stroke-width="2"/><text x="334" y="112" font-size="12.5" font-weight="800" fill="#946200">2 · Chicken Game</text><text x="334" y="140" font-size="11" fill="var(--ink, #15172e)">Swerve/Swerve = Safe compromise</text><text x="334" y="162" font-size="11" fill="var(--ink-2, #4a4f6a)">Straight/Straight = Fatal crash!</text><line x1="334" y1="180" x2="568" y2="180" stroke="var(--line-2, #cbd1e1)"/><text x="334" y="204" font-size="11" font-weight="700" fill="#946200">Lesson: Never corner rivals with 0 to lose</text><rect x="596" y="86" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="2"/><text x="610" y="112" font-size="12.5" font-weight="800" fill="#0d9488">3 · Fair Cake-Cutting</text><text x="610" y="140" font-size="11" fill="var(--ink, #15172e)">Player A cuts into 2 pieces</text><text x="610" y="162" font-size="11" fill="var(--ink-2, #4a4f6a)">Player B chooses their slice first</text><line x1="610" y1="180" x2="844" y2="180" stroke="var(--line-2, #cbd1e1)"/><text x="610" y="204" font-size="11" font-weight="700" fill="#0d9488">Lesson: Self-enforcing fairness mechanism</text><rect x="182" y="248" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#2458d3" stroke-width="2"/><text x="196" y="274" font-size="12.5" font-weight="800" fill="#2458d3">4 · Battle of the Sexes</text><text x="196" y="302" font-size="11" fill="var(--ink, #15172e)">Together at Concert (5,3) or Match (3,5)</text><text x="196" y="324" font-size="11" fill="var(--ink-2, #4a4f6a)">Go alone = (2,2) Worst total (4 &lt; 8)!</text><line x1="196" y1="342" x2="430" y2="342" stroke="var(--line-2, #cbd1e1)"/><text x="196" y="366" font-size="11" font-weight="700" fill="#2458d3">Lesson: Reciprocal turn-taking over time</text><rect x="470" y="248" width="262" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#6835f0" stroke-width="2"/><text x="484" y="274" font-size="12.5" font-weight="800" fill="#6835f0">5 · Rock–Paper–Scissors</text><text x="484" y="302" font-size="11" fill="var(--ink, #15172e)">Rock &gt; Scissors &gt; Paper &gt; Rock</text><text x="484" y="324" font-size="11" fill="var(--ink-2, #4a4f6a)">Any predictable pattern gets exploited</text><line x1="484" y1="342" x2="718" y2="342" stroke="var(--line-2, #cbd1e1)"/><text x="484" y="366" font-size="11" font-weight="700" fill="#6835f0">Lesson: Randomize equally across moves</text>
    </svg>