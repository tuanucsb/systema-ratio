    <rect x="24" y="20" width="852" height="400" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="46" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Critical Thinking Tier 2: Paul–Elder Metacognitive Matrix (pp. 60–63)</text>
    <text x="46" y="74" font-size="12.5" fill="var(--ink-2, #4a4f6a)">Apply the 8 Intellectual Standards to the 8 Elements of Thought to forge the 8 Intellectual Virtues.</text>
    <rect x="46" y="96" width="248" height="296" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#087087" stroke-width="2"/><rect x="46" y="96" width="248" height="52" rx="10" fill="#087087"/><text x="170" y="118" text-anchor="middle" class="mn" font-size="11" font-weight="800" fill="#ffffff">STEP 1 · ANALYZE</text><text x="170" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8 Elements of Thought</text><text x="64" y="174" font-size="12" font-weight="600" fill="var(--ink, #15172e)">1. Purpose</text><text x="64" y="200" font-size="12" font-weight="600" fill="var(--ink, #15172e)">2. Key Question</text><text x="64" y="226" font-size="12" font-weight="600" fill="var(--ink, #15172e)">3. Point of View</text><text x="64" y="252" font-size="12" font-weight="600" fill="var(--ink, #15172e)">4. Assumptions</text><text x="64" y="278" font-size="12" font-weight="600" fill="var(--ink, #15172e)">5. Information</text><text x="64" y="304" font-size="12" font-weight="600" fill="var(--ink, #15172e)">6. Concepts &amp; Inference</text><text x="64" y="330" font-size="12" font-weight="600" fill="var(--ink, #15172e)">7. Conclusions</text><text x="64" y="356" font-size="12" font-weight="600" fill="var(--ink, #15172e)">8. Implications</text><line x1="298" y1="244" x2="320" y2="244" stroke="var(--ink-2, #4a4f6a)" stroke-width="2.4" marker-end="url(#arInk)"/><rect x="326" y="96" width="248" height="296" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#2458d3" stroke-width="2"/><rect x="326" y="96" width="248" height="52" rx="10" fill="#2458d3"/><text x="450" y="118" text-anchor="middle" class="mn" font-size="11" font-weight="800" fill="#ffffff">STEP 2 · EVALUATE</text><text x="450" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8 Universal Standards</text><text x="344" y="174" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Accuracy (True?)</text><text x="344" y="200" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Consistency / Precision</text><text x="344" y="226" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Relevance</text><text x="344" y="252" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Depth (Complexities)</text><text x="344" y="278" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Breadth (Rival views)</text><text x="344" y="304" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Logic (Coherence)</text><text x="344" y="330" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Significance</text><text x="344" y="356" font-size="12" font-weight="600" fill="var(--ink, #15172e)">• Fairness</text><line x1="578" y1="244" x2="600" y2="244" stroke="var(--ink-2, #4a4f6a)" stroke-width="2.4" marker-end="url(#arInk)"/><rect x="606" y="96" width="248" height="296" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="2"/><rect x="606" y="96" width="248" height="52" rx="10" fill="#0d9488"/><text x="730" y="118" text-anchor="middle" class="mn" font-size="11" font-weight="800" fill="#ffffff">STEP 3 · IMPROVE</text><text x="730" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8 Intellectual Virtues</text><text x="624" y="174" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Intellectual Humility</text><text x="624" y="200" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Intellectual Courage</text><text x="624" y="226" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Intellectual Empathy</text><text x="624" y="252" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Intellectual Autonomy</text><text x="624" y="278" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Intellectual Integrity</text><text x="624" y="304" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Perseverance</text><text x="624" y="330" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Confidence in Reason</text><text x="624" y="356" font-size="12" font-weight="600" fill="var(--ink, #15172e)">★ Fairmindedness</text>
