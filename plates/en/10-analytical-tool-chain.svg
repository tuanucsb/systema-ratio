<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Analytical Thinking Tool Chain"><title>Analytical Thinking Tool Chain</title><style>
  svg { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fb; color: #15172e; }
  .hd { font-family: 'Fraunces', Georgia, serif; font-weight: 800; }
  .mn { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
</style><rect x="0" y="0" width="900" height="450" rx="12" fill="var(--bg, #f5f6fb)"/><defs>
      <marker id="arInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2, #4a4f6a)"/>
      </marker>
      <marker id="arTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#0d9488"/>
      </marker>
      <marker id="arRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#b81f2e"/>
      </marker>
      <marker id="arGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#0b7547"/>
      </marker>
      <marker id="arBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#2458d3"/>
      </marker>
    </defs>
    <rect x="24" y="20" width="852" height="410" rx="12" fill="var(--surface, #ffffff)" stroke="var(--line, #e1e5f0)"/>
    <text x="44" y="52" class="hd" font-size="19" font-weight="700" fill="var(--ink, #15172e)">Analytical Thinking Pipeline: How Core Tools Chain Together (p. 84)</text>
    <text x="44" y="73" font-size="12.5" fill="var(--ink-2, #4a4f6a)">“Analytical tools are rarely used in isolation—chain them from decomposition to prioritized action.”</text>

    <!-- 1. Fishbone -->
    <rect x="44" y="96" width="388" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#0d9488" stroke-width="1.8"/>
    <text x="60" y="120" font-weight="800" font-size="13" fill="var(--c-analytical, #0b7268)">1 · FISHBONE (Ishikawa 5M1E / 4S / 8P)</text>
    <line x1="68" y1="176" x2="346" y2="176" stroke="#0d9488" stroke-width="2.6" marker-end="url(#arTeal)"/>
    <line x1="115" y1="138" x2="150" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="195" y1="138" x2="230" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="275" y1="138" x2="310" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="115" y1="216" x2="150" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="195" y1="216" x2="230" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <line x1="275" y1="216" x2="310" y2="176" stroke="#0d9488" stroke-width="1.8"/>
    <polygon points="350,154 418,176 350,198" fill="#0d9488"/>
    <text x="378" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Problem</text>
    <text x="112" y="134" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Machine</text>
    <text x="192" y="134" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Method</text>
    <text x="275" y="134" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Material</text>
    <text x="112" y="231" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">People</text>
    <text x="192" y="231" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Measure</text>
    <text x="275" y="231" text-anchor="middle" font-size="11" fill="var(--ink-2, #4a4f6a)">Environ.</text>

    <!-- 2. 5 Whys -->
    <rect x="468" y="96" width="388" height="142" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#2458d3" stroke-width="1.8"/>
    <text x="484" y="120" font-weight="800" font-size="13" fill="var(--c-critical, #2458d3)">2 · 5 WHYS DRILL (Ohno’s Robot Example)</text>
    <text x="484" y="144" font-size="11.5" fill="var(--ink, #15172e)">Why 1: Circuit overloaded &amp; fuse blew</text>
    <text x="498" y="163" font-size="11.5" fill="var(--ink, #15172e)">↳ Why 2–3: Bearing dry ← Oil pump weak</text>
    <text x="512" y="182" font-size="11.5" fill="var(--ink, #15172e)">↳ Why 4: Intake clogged by metal shavings</text>
    <text x="526" y="203" font-size="12" font-weight="800" fill="var(--c-trap, #b81f2e)">↳ Why 5 (Root): Pump lacks a strainer! [Verify]</text>

    <!-- 3. SWOT -->
    <rect x="44" y="258" width="388" height="150" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#946200" stroke-width="1.8"/>
    <text x="60" y="282" font-weight="800" font-size="13" fill="var(--c-creative, #946200)">3 · SWOT + WEIGHTED COMPARISON</text>
    <rect x="60" y="294" width="174" height="46" rx="6" fill="rgba(21,128,61,0.12)"/>
    <text x="147" y="321" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-systems, #0b7547)">S · Strengths (Internal)</text>
    <rect x="242" y="294" width="174" height="46" rx="6" fill="rgba(229,51,63,0.10)"/>
    <text x="329" y="321" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-trap, #b81f2e)">W · Weaknesses (Internal)</text>
    <rect x="60" y="346" width="174" height="46" rx="6" fill="rgba(37,99,235,0.10)"/>
    <text x="147" y="373" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-critical, #2458d3)">O · Opportunities (External)</text>
    <rect x="242" y="346" width="174" height="46" rx="6" fill="rgba(217,119,6,0.14)"/>
    <text x="329" y="373" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--c-strategic, #b34a00)">T · Threats (External)</text>

    <!-- 4. Eisenhower (Upgrades blurry Fig 4.3!) -->
    <rect x="468" y="258" width="388" height="150" rx="10" fill="var(--surface-2, #eef1f8)" stroke="#3346e0" stroke-width="1.8"/>
    <text x="484" y="282" font-weight="800" font-size="13" fill="var(--c-logical, #3346e0)">4 · EISENHOWER EXECUTION MATRIX (p. 80)</text>
    <rect x="484" y="294" width="174" height="46" rx="6" fill="rgba(229,51,63,0.12)" stroke="#b81f2e"/>
    <text x="571" y="314" text-anchor="middle" font-size="11" font-weight="800" fill="var(--c-trap, #b81f2e)">Q1 · Urgent + Important</text>
    <text x="571" y="330" text-anchor="middle" font-size="10.5" fill="var(--ink, #15172e)">Do Immediately</text>
    <rect x="666" y="294" width="174" height="46" rx="6" fill="rgba(13,148,136,0.15)" stroke="#0d9488" stroke-width="2"/>
    <text x="753" y="314" text-anchor="middle" font-size="11" font-weight="800" fill="var(--c-analytical, #0b7268)">Q2 · Not Urgent + Important</text>
    <text x="753" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--c-analytical, #0b7268)">Schedule &amp; Invest Early ★</text>
    <rect x="484" y="346" width="174" height="46" rx="6" fill="var(--surface, #ffffff)" stroke="var(--line-2, #cbd1e1)"/>
    <text x="571" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2, #4a4f6a)">Q3 · Urgent + Not Imp.</text>
    <text x="571" y="382" text-anchor="middle" font-size="10.5" fill="var(--ink-3, #656b87)">Delegate</text>
    <rect x="666" y="346" width="174" height="46" rx="6" fill="var(--surface, #ffffff)" stroke="var(--line-2, #cbd1e1)"/>
    <text x="753" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-3, #656b87)">Q4 · Neither</text>
    <text x="753" y="382" text-anchor="middle" font-size="10.5" fill="var(--ink-3, #656b87)">Eliminate</text>
    </svg>